<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>লগইন – SUBHA MODS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 28px;
    padding: 40px 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.08);
    text-align: center;
  }
  .login-box h1 {
    font-size: 26px;
    font-weight: 800;
    color: #0b1e33;
  }
  .login-box p {
    color: #64748b;
    font-size: 14px;
    margin: 8px 0 24px;
  }
  .login-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
    transition: 0.2s;
    font-family: inherit;
  }
  .login-input:focus {
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
  }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: #10b981;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
  }
  .btn-login:hover { background: #059669; }
  .login-error {
    color: #ef4444;
    font-size: 13px;
    margin-top: 10px;
    display: none;
    text-align: left;
    padding: 10px 14px;
    background: #fef2f2;
    border-radius: 10px;
  }
  .login-error.show { display: block; }
  .login-toggle {
    margin-top: 14px;
    font-size: 13px;
    color: #64748b;
  }
  .login-toggle a {
    color: #10b981;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .back-home {
    display: inline-block;
    margin-top: 16px;
    color: #94a3b8;
    font-size: 13px;
    text-decoration: none;
  }
  .back-home:hover { color: #0b1e33; }
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #0b1e33;
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    transform: translateY(80px);
    opacity: 0;
    transition: 0.3s ease;
    z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="login-box">
  <h1>🔐 SUBHA MODS</h1>
  <p id="loginSub">লগইন করুন আপনার অ্যাক্সেস চেক করতে</p>

  <input type="email" id="loginEmail" class="login-input" placeholder="ইমেইল লিখুন" autocomplete="email" />
  <input type="password" id="loginPassword" class="login-input" placeholder="পাসওয়ার্ড লিখুন" autocomplete="current-password" />
  <button class="btn-login" id="loginBtn">লগইন করুন</button>
  <div class="login-error" id="loginError"></div>

  <div class="login-toggle">
    নতুন ব্যবহারকারী? <a id="toggleAuthLink">অ্যাকাউন্ট তৈরি করুন</a>
  </div>
  <a href="index.html" class="back-home">
    <i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরে যান
  </a>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   Regular user login only.
   Admin panel is in a separate hidden folder.
   ============================================================ */

const TARGET = 'prediction.html';

let isSignUp = false;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

function showError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.add('show');
}

function clearError() {
  document.getElementById('loginError').classList.remove('show');
}

const getUsers = () => JSON.parse(localStorage.getItem('subha_users') || '[]');
const saveUsers = u => localStorage.setItem('subha_users', JSON.stringify(u));
const setCurrentUser = u => localStorage.setItem('subha_current_user', JSON.stringify(u));

function getDaysRemaining(startDate, accessDays) {
  if (!startDate || !accessDays) return 0;
  const end = new Date(startDate);
  end.setDate(end.getDate() + accessDays);
  return Math.max(0, Math.ceil((end - Date.now()) / 86400000));
}

function handleSubmit(email, password) {
  clearError();

  if (!email.includes('@')) return showError('সঠিক ইমেইল দিন।');
  if (password.length < 6) return showError('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে।');

  const users = getUsers();
  let user = users.find(u => u.email === email);

  // ===== Sign up =====
  if (isSignUp) {
    if (user) return showError('এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট আছে। লগইন করুন।');
    user = {
      email,
      password,
      accessDays: 0,
      startDate: null,
      created: new Date().toISOString()
    };
    users.push(user);
    saveUsers(users);
    setCurrentUser(user);
    showToast('অ্যাকাউন্ট তৈরি হয়েছে — অ্যাডমিন অনুমোদনের অপেক্ষায়।');
    setTimeout(() => { window.location.href = TARGET; }, 900);
    return;
  }

  // ===== Login =====
  if (!user) return showError('এই ইমেইলে কোনো অ্যাকাউন্ট নেই। সাইন আপ করুন।');
  if (user.password !== password) return showError('ভুল পাসওয়ার্ড!');

  setCurrentUser(user);
  const days = getDaysRemaining(user.startDate, user.accessDays);
  if (days > 0) {
    showToast(`স্বাগতম! ${days} দিন বাকি।`);
    setTimeout(() => { window.location.href = TARGET; }, 500);
  } else {
    showError('❌ আপনার অ্যাক্সেস নেই বা মেয়াদ শেষ। অ্যাডমিনের সাথে যোগাযোগ করুন।');
  }
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPassword').value;
  if (!email || !pass) return showError('ইমেইল ও পাসওয়ার্ড দিন।');
  handleSubmit(email, pass);
});

document.getElementById('toggleAuthLink').addEventListener('click', function () {
  isSignUp = !isSignUp;
  document.getElementById('loginBtn').textContent = isSignUp ? 'অ্যাকাউন্ট তৈরি করুন' : 'লগইন করুন';
  document.getElementById('loginSub').textContent = isSignUp
    ? 'নতুন অ্যাকাউন্ট খুলুন'
    : 'লগইন করুন আপনার অ্যাক্সেস চেক করতে';
  this.textContent = isSignUp
    ? 'ইতিমধ্যে অ্যাকাউন্ট আছে? লগইন করুন'
    : 'নতুন ব্যবহারকারী? অ্যাকাউন্ট তৈরি করুন';
  clearError();
});

['loginEmail', 'loginPassword'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
});
</script>
</body>
</html>
