<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBHA MODS — Prediction Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-green:#00a859; --dark-green:#034222; --light-green-bg:#f2f7f4;
    --card-bg:#fff; --accent-green:#00e676; --text-dark:#1b2e23;
    --text-muted:#6b8273; --border-light:#e2ece5;
    --font-main:'Poppins',sans-serif; --font-num:'Outfit',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:var(--font-main); }
  body {
    background: var(--light-green-bg); color: var(--text-dark);
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 90px;
  }

  .top-header {
    background: var(--primary-green); padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    color: #fff; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 12px rgba(0,168,89,0.2);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-left i { font-size: 18px; cursor: pointer; }
  .brand-logo {
    font-family: var(--font-num); font-size: 22px; font-weight: 900;
    font-style: italic; letter-spacing: -0.5px;
  }
  .brand-logo span { color: #80e6b1; font-style: normal; }
  .rules-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; cursor: pointer;
    background: rgba(255,255,255,0.15); padding: 5px 10px; border-radius: 8px;
  }

  .container { padding: 12px; }

  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 2400; display: none;
  }
  .drawer-overlay.active { display: block; }
  .drawer-menu {
    position: fixed; top: 0; left: -100%; width: 80%; max-width: 320px; height: 100%;
    background: #fff; z-index: 2500; transition: left 0.3s ease;
    padding: 20px; display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
  }
  .drawer-menu.active { left: 0; }
  .drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 12px;
  }
  .drawer-title { font-size: 18px; font-weight: 800; color: var(--dark-green); }
  .nav-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: 12px; font-size: 14px; font-weight: 600;
    color: var(--text-dark); cursor: pointer; transition: 0.2s;
  }
  .nav-item:hover, .nav-item.active { background: #eaf6ed; color: var(--primary-green); }
  .nav-item i { font-size: 16px; width: 20px; }
  .user-profile-box {
    background: #f8fafc; border: 1px solid var(--border-light);
    border-radius: 14px; padding: 12px 16px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .user-left { display: flex; align-items: center; gap: 12px; }
  .user-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: #008844;
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }
  .user-name { font-size: 14px; font-weight: 700; }
  .user-email { font-size: 11px; color: var(--text-muted); }
  .logout-btn {
    background: #ef4444; color: #fff; border: none; padding: 6px 14px;
    border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .card {
    background: var(--card-bg); border-radius: 18px; padding: 14px;
    margin-bottom: 12px; border: 1px solid var(--border-light);
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }

  .timer-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 10px; }
  .how-to-play-card { background: #f8fbf9; border: 1px solid var(--border-light); border-radius: 14px; padding: 10px; }
  .card-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .card-title-sm { font-size: 14px; font-weight: 700; }
  .how-balls-row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }

  .mini-ball {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff;
    font-family: var(--font-num);
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.35), inset 2px 2px 4px rgba(255,255,255,0.7), 0 3px 6px rgba(0,0,0,0.12);
    border: 2px solid rgba(255,255,255,0.85);
  }
  .ball-green { background: radial-gradient(circle at 35% 35%, #81c784, #388e3c 70%, #1b5e20 100%); }
  .ball-red { background: radial-gradient(circle at 35% 35%, #e57373, #d32f2f 70%, #8e0000 100%); }
  .ball-half-0 { background: linear-gradient(135deg, #ef5350 48%, #ab47bc 52%); }
  .ball-half-5 { background: linear-gradient(135deg, #66bb6a 48%, #ab47bc 52%); }

  .timer-card { text-align: center; }
  .timer-title { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .timer-digits { display: flex; justify-content: center; gap: 4px; font-family: var(--font-num); font-size: 20px; font-weight: 800; }
  .timer-box {
    background: #f0f5f2; padding: 4px 8px; border-radius: 8px;
    color: var(--text-dark); border: 1px solid #d4e3d9;
  }
  .period-text { font-size: 10px; color: var(--text-muted); margin-top: 6px; font-family: var(--font-num); font-weight: 600; }

  .ai-box {
    background: linear-gradient(180deg, #07522a 0%, #03361a 100%);
    color: #fff; border-radius: 20px; padding: 16px; margin-bottom: 12px;
  }
  .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ai-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .ai-stats-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    align-items: center; background: #fff; padding: 14px 8px;
    border-radius: 16px; margin-bottom: 12px; color: var(--text-dark);
  }
  .stat-col { text-align: center; }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
  .circle-progress {
    width: 60px; height: 60px; border-radius: 50%;
    background: conic-gradient(var(--primary-green) 0%, #e2ece5 0);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; transition: background 0.4s ease;
  }
  .circle-inner {
    width: 46px; height: 46px; background: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #008844;
  }
  .result-val { font-size: 18px; font-weight: 800; color: #008844; font-family: var(--font-num); }
  .result-line { width: 50px; height: 3px; background: #00a859; border-radius: 2px; margin: 8px auto 0; }

  .gen-btn-ribbon {
    width: 100%; padding: 14px; background: var(--primary-green); color: #fff;
    border: none; font-size: 15px; font-weight: 800; cursor: pointer;
    letter-spacing: 0.5px; text-transform: uppercase; border-radius: 4px;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    box-shadow: 0 4px 15px rgba(0,168,89,0.4); transition: 0.1s;
  }
  .gen-btn-ribbon:active { transform: scale(0.98); }
  .gen-btn-ribbon:disabled { opacity: 0.5; cursor: not-allowed; }

  .signal-list { margin-top: 10px; }
  .signal-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: rgba(255,255,255,0.06);
    border-radius: 10px; margin-bottom: 6px; font-size: 12px;
  }
  .signal-name { font-weight: 700; color: #80e6b1; }
  .signal-value { font-family: var(--font-num); font-weight: 700; color: #fff; }

  .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 700; }

  .chart-container { position: relative; width: 100%; height: 140px; }
  .chart-svg { width: 100%; height: 100%; overflow: visible; }

  .hot-list { display: flex; flex-direction: column; gap: 10px; }
  .hot-item { display: flex; justify-content: space-between; align-items: center; }
  .hot-left { display: flex; align-items: center; gap: 10px; }
  .hot-badge {
    background: #fff0f0; color: #ff4d4d; border-radius: 8px;
    padding: 2px 8px; font-size: 11px; font-weight: 700;
  }
  .hot-count { font-size: 12px; font-weight: 700; color: var(--text-muted); font-family: var(--font-num); }

  .history-card { padding: 0; overflow: hidden; }
  .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-table th {
    background: var(--primary-green); color: #fff;
    padding: 12px 6px; font-weight: 600; font-size: 12px;
  }
  .history-table td {
    padding: 10px 4px; text-align: center;
    border-bottom: 1px solid #f0f4f1;
  }
  .period-cell { font-family: var(--font-num); font-size: 11px; font-weight: 600; }
  .bs-pill { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .bs-pill.small { background: #eaf6ed; color: #1e7e43; }
  .bs-pill.big { background: #fdeaea; color: #d32f2f; }

  .bottom-dock {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: var(--dark-green);
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 16px 12px; z-index: 1000;
    border-top-left-radius: 20px; border-top-right-radius: 20px;
  }
  .dock-btn {
    background: none; border: none; color: #a3c9b3;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; cursor: pointer; flex: 1;
  }
  .dock-btn.active { color: var(--accent-green); }
  .dock-btn i { font-size: 20px; }
  .fab-btn {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent-green);
    color: var(--dark-green); display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 4px 15px rgba(0,230,118,0.5);
    border: 4px solid var(--dark-green); margin-top: -24px; cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 100px; right: 20px;
    background: #0b1e33; color: #fff; padding: 12px 20px;
    border-radius: 12px; font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    transform: translateY(80px); opacity: 0; transition: 0.3s; z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="top-header">
  <div class="header-left">
    <i class="fas fa-bars" onclick="toggleDrawer(true)"></i>
    <div class="brand-logo">SUBHA<span>MODS</span></div>
  </div>
  <div class="rules-btn" onclick="showRules()">
    <i class="fas fa-shield-alt"></i><span>Rules</span>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)"></div>
<div class="drawer-menu" id="drawerMenu">
  <div class="drawer-header">
    <div class="drawer-title">Control Center</div>
    <i class="fas fa-times" style="font-size:20px;color:var(--text-muted);cursor:pointer" onclick="toggleDrawer(false)"></i>
  </div>

  <div class="user-profile-box" style="margin-bottom:16px;">
    <div class="user-left">
      <div class="user-avatar" id="avatarInitial">M</div>
      <div>
        <div class="user-name" id="profileName">User</div>
        <div class="user-email" id="profileEmail">user@example.com</div>
      </div>
    </div>
  </div>

  <div class="nav-list">
    <div class="nav-item active"><i class="fas fa-brain"></i> Prediction</div>
    <div class="nav-item" onclick="window.location.href='analytics.html'"><i class="fas fa-chart-bar"></i> Analytics</div>
    <div class="nav-item" onclick="showRules()"><i class="fas fa-shield-alt"></i> Rules</div>
  </div>

  <div style="margin-top:auto; padding-top:20px; border-top:1px solid var(--border-light);">
    <button class="logout-btn" style="width:100%; padding:12px;" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </div>
</div>

<div class="container">
  <div class="card timer-grid">
    <div class="how-to-play-card">
      <div class="card-title-sm">How to play</div>
      <div class="card-subtitle">Win Go 1Min</div>
      <div class="how-balls-row">
        <div class="mini-ball ball-red">2</div>
        <div class="mini-ball ball-red">2</div>
        <div class="mini-ball ball-green">7</div>
        <div class="mini-ball ball-red">2</div>
      </div>
    </div>
    <div class="timer-card">
      <div class="timer-title">Time remaining</div>
      <div class="timer-digits">
        <div class="timer-box">0</div>
        <div class="timer-box">0</div>
        <span style="align-self:center;">:</span>
        <div class="timer-box" id="secDigit1">0</div>
        <div class="timer-box" id="secDigit2">0</div>
      </div>
      <div class="period-text" id="periodDisplay">-- | --</div>
    </div>
  </div>

  <div class="ai-box">
    <div class="ai-header">
      <div>
        <div class="ai-title"><i class="fas fa-brain" style="color:var(--accent-green)"></i> Statistical Engine</div>
        <div style="font-size:11px;color:#a3c9b3;margin-top:2px;" id="engineStatus">Waiting for data...</div>
      </div>
    </div>

    <div class="ai-stats-grid">
      <div class="stat-col">
        <div class="stat-label">Confidence</div>
        <div class="circle-progress" id="winRateCircle">
          <div class="circle-inner" id="winRateVal">—</div>
        </div>
      </div>
      <div class="stat-col">
        <div class="stat-label">Streak</div>
        <div class="result-val" id="streakVal" style="color:#f59e0b">—</div>
      </div>
      <div class="stat-col">
        <div class="stat-label">Prediction</div>
        <div class="result-val" id="predResultTxt">—</div>
        <div class="result-line"></div>
      </div>
    </div>

    <button class="gen-btn-ribbon" id="genBtn" onclick="generatePrediction()" disabled>
      GENERATE PREDICTION
    </button>

    <div class="signal-list" id="signalList"></div>
  </div>

  <div class="card">
    <div class="card-header-row">
      <div class="card-title">Trend Chart</div>
    </div>
    <div class="chart-container">
      <svg class="chart-svg" id="trendChartSvg" viewBox="0 0 350 140"></svg>
    </div>
  </div>

  <div class="card">
    <div class="card-header-row">
      <div class="card-title">Hot & Cold</div>
    </div>
    <div class="hot-list" id="hotColdContainer"></div>
  </div>

  <div class="history-card card">
    <table class="history-table">
      <thead>
        <tr><th>Period</th><th>Number</th><th>Big/Small</th><th>Result</th></tr>
      </thead>
      <tbody id="historyTBody">
        <tr><td colspan="4" style="padding:15px;">Connecting...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="bottom-dock">
  <button class="dock-btn active" onclick="window.location.reload()">
    <i class="fas fa-sync-alt"></i><span>Refresh</span>
  </button>
  <div class="fab-btn" onclick="generatePrediction()">
    <i class="fas fa-bolt"></i>
  </div>
  <button class="dock-btn" onclick="window.location.href='analytics.html'">
    <i class="fas fa-chart-bar"></i><span>Chart</span>
  </button>
</div>

<div id="toast" class="toast"></div>

<script src="pattern-engine.js"></script>
<script>
(function checkAccess() {
  const u = JSON.parse(localStorage.getItem('subha_current_user') || 'null');
  if (!u) { window.location.href = 'login.html'; return; }
  if (u.role === 'admin') return;

  const end = u.startDate ? new Date(u.startDate) : null;
  if (end) end.setDate(end.getDate() + (u.accessDays || 0));
  if (!end || Date.now() > end) {
    alert('❌ অ্যাক্সেস নেই বা মেয়াদ শেষ।');
    localStorage.removeItem('subha_current_user');
    window.location.href = 'login.html';
  }
})();

const engine = new WingoPatternEngine();
const predictionsMap = {};
const API_URL = 'https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json';

let isFetching = false;
let failCount = 0;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

function toggleDrawer(show) {
  document.getElementById('drawerMenu').classList.toggle('active', show);
  document.getElementById('drawerOverlay').classList.toggle('active', show);
}

function showRules() {
  alert(
`SUBHA MODS — Rules
• Statistical analysis of past draws, not guaranteed outcomes.
• Confidence is derived from signal agreement and data quality.
• Confidence drops when the market looks random (high entropy).
• No tool can beat a fair RNG. Play responsibly.`
  );
}

function logout() {
  localStorage.removeItem('subha_current_user');
  window.location.href = 'login.html';
}

(function populateProfile() {
  const u = JSON.parse(localStorage.getItem('subha_current_user') || 'null');
  if (!u) return;
  const initial = (u.email || 'U')[0].toUpperCase();
  const name = u.email.split('@')[0];
  document.getElementById('avatarInitial').textContent = initial;
  document.getElementById('profileName').textContent = name;
  document.getElementById('profileEmail').textContent = u.email;
})();

async function fetchLiveWingoData() {
  if (isFetching) return;
  isFetching = true;
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(`${API_URL}?ts=${Date.now()}`, { signal: ctrl.signal });
    clearTimeout(timeout);

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const list = json?.data?.list || json?.list || json;

    if (!Array.isArray(list) || !list.length) throw new Error('Empty list');

    engine.update(list);
    failCount = 0;

    if (engine.settle(predictionsMap)) updateStatsUI();

    renderHistoryTable(list.slice(0, 10));
    updatePeriodDisplay(list[0]);
    renderTrendChart(list);
    renderHotCold(list);
    updateStreakUI();

    document.getElementById('engineStatus').textContent =
      `${list.length} rounds loaded · ${new Date().toLocaleTimeString()}`;
    document.getElementById('genBtn').disabled = false;
  } catch (err) {
    failCount++;
    console.error('Fetch error:', err);
    document.getElementById('engineStatus').textContent =
      `⚠ Connection failed (attempt ${failCount})`;
    if (failCount === 1) showToast('API fetch failed — retrying...');
    setTimeout(fetchLiveWingoData, 5000);
  } finally {
    isFetching = false;
  }
}

function generatePrediction() {
  const p = engine.predict();
  if (!p.ok) {
    document.getElementById('predResultTxt').textContent = 'WAIT';
    document.getElementById('predResultTxt').style.color = '#f59e0b';
    document.getElementById('engineStatus').textContent = p.reason;
    return;
  }

  document.getElementById('predResultTxt').textContent = `${p.num} / ${p.bs}`;
  document.getElementById('predResultTxt').style.color = '#008844';
  document.getElementById('winRateVal').textContent = `${p.confidence}%`;
  document.getElementById('winRateCircle').style.background =
    `conic-gradient(var(--primary-green) ${p.confidence}%, #e2ece5 0)`;

  document.getElementById('signalList').innerHTML = p.signals.map(s => `
    <div class="signal-row">
      <span class="signal-name">${s.source}</span>
      <span class="signal-value">${s.side === 'B' ? 'Big' : 'Small'} · ${Math.round(s.weight * 100)}%</span>
    </div>
  `).join('');

  const latest = engine.history[0];
  if (latest) {
    try {
      const target = (BigInt(latest.period) + 1n).toString();
      predictionsMap[target] = {
        predictedNum: p.num,
        predictedBs: p.bs,
        settled: false
      };
    } catch (_) {}
  }

  showToast(`Prediction: ${p.num} / ${p.bs} (${p.confidence}%)`);
}

function updateStatsUI() {}

function updateStreakUI() {
  const s = engine.currentStreak();
  if (!s.length) return;
  document.getElementById('streakVal').textContent =
    `${s.length}× ${s.side === 'B' ? 'Big' : 'Small'}`;
}

function renderHistoryTable(list) {
  const tbody = document.getElementById('historyTBody');
  tbody.innerHTML = '';
  list.forEach(item => {
    const num = Number(item.number !== undefined ? item.number : item.resultNum);
    const bs = num >= 5 ? 'Big' : 'Small';
    const period = item.issueNumber || item.issueNum || '—';
    const pred = predictionsMap[period];
    let resultCell = '—';
    if (pred && pred.settled) {
      resultCell = pred.result === 'WIN'
        ? '<span style="color:#10b981;font-weight:700">WIN</span>'
        : '<span style="color:#ef4444;font-weight:700">LOSS</span>';
    }

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="period-cell">${period}</td>
      <td><div class="mini-ball ${engine.ballClass(num)}" style="margin:0 auto">${num}</div></td>
      <td><span class="bs-pill ${bs.toLowerCase()}">${bs}</span></td>
      <td>${resultCell}</td>
    `;
    tbody.appendChild(tr);
  });
}

function updatePeriodDisplay(latest) {
  if (!latest) return;
  try {
    const next = (BigInt(latest.issueNumber || latest.issueNum) + 1n).toString();
    const formatted = next.length > 8
      ? `${next.slice(0, 8)} | ${next.slice(8)}`
      : next;
    document.getElementById('periodDisplay').textContent = formatted;
  } catch (_) {}
}

function renderTrendChart(list) {
  const svg = document.getElementById('trendChartSvg');
  svg.innerHTML = '';
  if (!list?.length) return;

  const items = list.slice(0, 6).reverse();
  const W = 350, H = 140;
  const stepX = W / (items.length - 1 || 1);
  const getY = n => H - 20 - (n / 9) * (H - 40);

  const points = items.map((it, i) => {
    const num = Number(it.number !== undefined ? it.number : it.resultNum);
    return { x: i * stepX, y: getY(num), num };
  });

  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  poly.setAttribute('points', points.map(p => `${p.x},${p.y}`).join(' '));
  poly.setAttribute('fill', 'none');
  poly.setAttribute('stroke', '#00a859');
  poly.setAttribute('stroke-width', '3');
  svg.appendChild(poly);

  points.forEach(p => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', '10');
    c.setAttribute('fill', p.num >= 5 ? '#388e3c' : '#d32f2f');
    c.setAttribute('stroke', '#fff'); c.setAttribute('stroke-width', '2');
    svg.appendChild(c);

    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y + 3.5);
    t.setAttribute('fill', '#fff'); t.setAttribute('font-size', '10');
    t.setAttribute('font-weight', '800'); t.setAttribute('text-anchor', 'middle');
    t.textContent = p.num;
    svg.appendChild(t);
  });
}

function renderHotCold(list) {
  const container = document.getElementById('hotColdContainer');
  container.innerHTML = '';
  if (!list?.length) return;

  const counts = Array(10).fill(0);
  list.forEach(it => {
    const n = Number(it.number !== undefined ? it.number : it.resultNum);
    counts[n]++;
  });

  const sorted = counts.map((c, n) => ({ n, c })).sort((a, b) => b.c - a.c);
  sorted.slice(0, 3).forEach(({ n, c }) => {
    const row = document.createElement('div');
    row.className = 'hot-item';
    row.innerHTML = `
      <div class="hot-left">
        <div class="mini-ball ${engine.ballClass(n)}">${n}</div>
        <div class="hot-badge"><i class="fas fa-fire"></i> Hot</div>
      </div>
      <div class="hot-count">${c} Times</div>
    `;
    container.appendChild(row);
  });
}

function startTimer() {
  setInterval(() => {
    const s = 60 - (new Date().getSeconds() % 60);
    const ds = s === 60 ? 0 : s;
    const str = String(ds).padStart(2, '0');
    document.getElementById('secDigit1').textContent = str[0];
    document.getElementById('secDigit2').textContent = str[1];

    if (ds === 0 || ds === 58) {
      setTimeout(fetchLiveWingoData, 1500);
    }
  }, 1000);
}

fetchLiveWingoData();
startTimer();
setInterval(fetchLiveWingoData, 30000);
</script>
